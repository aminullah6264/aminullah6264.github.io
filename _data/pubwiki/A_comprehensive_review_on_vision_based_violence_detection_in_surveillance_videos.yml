tldr: >
  Earlier violence-detection surveys each covered one slice of the field — person-to-person only,
  or non-surveillance only — leaving readers to stitch the literature together from several
  sources. This 44-page review covers surveillance and non-surveillance, person-to-person and
  crowd violence in one place, organised by a new taxonomy of the neural architectures used. It
  catalogues 13 datasets with their state-of-the-art accuracies, nine open challenges, and ten
  future directions.

