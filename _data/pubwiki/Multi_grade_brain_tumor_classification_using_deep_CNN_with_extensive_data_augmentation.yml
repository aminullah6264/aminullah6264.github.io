limitations:
  - >-
    Augmentation multiplies samples but not information. With 121 source images on Radiopaedia,
    train and test augmentations derive from the same small pool of patients, so the reported gain
    reflects invariance to transformation rather than exposure to genuinely new cases.
  - >-
    Grades III and IV remain the dominant confusion — precisely the boundary that matters most
    clinically, since it separates anaplastic glioma from glioblastoma.
  - >-
    The two datasets are labelled differently: Radiopaedia by WHO grade, the brain tumour dataset
    by tumour type (meningioma, glioma, pituitary), so the two evaluations are not directly
    comparable and only the first tests the four-grade claim.
  - >-
    Only the fully connected layers are fine-tuned, leaving the convolutional features shaped
    entirely by natural images rather than by MRI.
  - >-
    No prospective or cross-institution validation is reported, so performance on scanners and
    protocols outside these datasets is unknown.

