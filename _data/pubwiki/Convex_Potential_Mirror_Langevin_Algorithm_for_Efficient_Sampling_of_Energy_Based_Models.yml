limitations:
  - >-
    The β-Mirror LSI assumption underpinning the convergence proof cannot be verified for real
    high-dimensional data; the paper states this directly rather than claiming otherwise.
  - >-
    The Hessian of the learned potential is approximated by its diagonal to make sampling
    affordable, discarding the off-diagonal curvature the mirror map was introduced to capture.
  - >-
    FID remains an order of magnitude behind score-based diffusion (20.85 vs 2.20 for NCSN++). The
    contribution is efficiency within the EBM family, not competitive image quality overall.
  - >-
    Per-iteration training is slower than CoopFlow; the reported speed advantage depends on memory
    headroom allowing larger batches, so it is hardware-dependent.
  - >-
    All image experiments are at 32x32 resolution, leaving scaling behaviour untested.
  - >-
    The best FID comes from the pretrained variant (CPMLA-prt), so the strongest result depends on a
    separate CP-Flow pretraining stage rather than fully joint training from scratch.

