tldr: >
  A survey of deep learning for the seven perception tasks that autonomous driving safety rests
  on, organised around a measurement-analysis-execution pipeline. Its value is less the taxonomy
  than the numbers it collects: pedestrian detection reaches 74% mAP in hard conditions,
  drowsiness detection tops out at 75.6% where humans manage 80%, and the best traffic-light
  detector on the VIVA dataset achieves 44% IoU. The paper's blunt conclusion is that none of the
  reviewed methods handles measurement, analysis and execution together, and that all of them
  assume high-spec GPUs or cloud servers.

